<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Update my PB · Oceania Rankings</title>
<meta name="description" content="Quickly send a new PB to the Oceania LOLBeans rankings.">
<meta name="theme-color" content="#070f1a">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700;800;900&display=swap">
<style>
:root { --bg: #070f1a; --panel: #0e1c2c; --panel2: #13263a; --line: #1f3a57; --text: #e6f1f9; --muted: #8aa6bb; --blue: #4aa8f0; --green: #9bf04a; --red: #ff6b7a; --gold: #f0b429; --font: "Figtree", system-ui, -apple-system, "Segoe UI", Arial, sans-serif; color-scheme: dark; }
* { box-sizing: border-box; margin: 0; }
body { background: var(--bg); color: var(--text); font-family: var(--font); line-height: 1.5; min-height: 100vh; }
body:before { content: ""; position: fixed; inset: 0; z-index: -1; background: radial-gradient(60% 40% at 15% 0%, rgba(74,168,240,.18), transparent 70%), radial-gradient(50% 35% at 100% 10%, rgba(155,240,74,.10), transparent 70%); }
.wrap { max-width: 560px; margin: 0 auto; padding: max(16px, env(safe-area-inset-top)) 16px 40px; }
.top { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; color: var(--muted); font-weight: 700; font-size: .9rem; text-decoration: none; }
.top img { width: 34px; height: 34px; }
.card { background: linear-gradient(180deg, var(--panel2), var(--panel)); border: 1px solid var(--line); border-radius: 22px; padding: 20px; }
.who { display: flex; align-items: center; gap: 14px; }
.av { width: 54px; height: 54px; border-radius: 16px; display: grid; place-items: center; font-weight: 900; font-size: 1.4rem; background: linear-gradient(135deg, #1d4f8f, #2f9e1c); flex: none; }
.who h1 { font-size: 1.5rem; font-weight: 900; line-height: 1.1; }
.who p { color: var(--muted); font-size: .9rem; }
.who b { color: var(--text); }
.find { margin-top: 4px; }
.find input, .tm input, .field input { width: 100%; font: 600 1rem var(--font); color: var(--text); background: #08131f; border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; outline: none; }
.find input:focus, .tm input:focus, .field input:focus { border-color: var(--blue); }
h2 { font-size: 1.05rem; font-weight: 800; margin: 22px 0 4px; }
.sub { color: var(--muted); font-size: .9rem; margin-bottom: 12px; }
.search { margin-bottom: 10px; }
.maps { display: grid; gap: 8px; }
.mp { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; background: rgba(255,255,255,.03); border: 1px solid var(--line); border-radius: 14px; padding: 8px 12px 8px 8px; color: inherit; font: inherit; cursor: pointer; transition: border-color .15s, background .15s; }
.mp:hover { border-color: var(--blue); }
.mp img { width: 56px; height: 36px; object-fit: cover; border-radius: 8px; flex: none; background: #123; }
.mp .nm { flex: 1; font-weight: 700; }
.mp .cur { font: 700 .95rem ui-monospace, Menlo, monospace; color: var(--muted); }
.mp.has { border-color: var(--green); background: rgba(155,240,74,.08); }
.mp.has .cur { color: var(--green); }
.mp .x { font-size: .75rem; color: var(--muted); }
.ed { display: none; margin: -2px 0 2px; padding: 12px; border: 1px solid var(--blue); border-top: 0; border-radius: 0 0 14px 14px; background: rgba(74,168,240,.06); }
.ed.open { display: block; }
.mp.open { border-color: var(--blue); border-radius: 14px 14px 0 0; }
.tm { display: flex; gap: 8px; }
.tm input { font: 800 1.4rem ui-monospace, Menlo, monospace; text-align: center; letter-spacing: .03em; }
.tm button { flex: none; }
.hint { font-size: .82rem; margin-top: 6px; color: var(--muted); min-height: 1.2em; }
.hint.bad { color: var(--red); font-weight: 700; } .hint.ok { color: var(--green); font-weight: 700; } .hint.rec { color: var(--gold); font-weight: 800; }
.btn { border: 0; border-radius: 14px; padding: 12px 18px; font: 900 1rem var(--font); cursor: pointer; }
.btn.g { background: linear-gradient(90deg, #9bf04a, #5fe0a0); color: #0b1622; box-shadow: 0 0 24px rgba(155,240,74,.35); }
.btn.b { background: var(--blue); color: #04101c; }
.btn.o { background: none; border: 1px solid var(--line); color: var(--text); }
.btn:disabled { opacity: .5; cursor: default; }
.bar { position: sticky; bottom: 0; margin-top: 18px; padding: 14px 0 max(14px, env(safe-area-inset-bottom)); background: linear-gradient(rgba(7,15,26,0), var(--bg) 22px); padding-top: 26px; }
.sum { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 10px; font-size: .9rem; color: var(--muted); }
.sum b { color: var(--text); }
.box { margin-top: 14px; border-radius: 14px; padding: 12px 14px; font-size: .9rem; }
.box.vid { border: 1px solid var(--gold); background: rgba(240,180,41,.08); }
.box.rec { border: 1px solid #b44ce0; background: rgba(180,76,224,.08); }
.box b { display: block; margin-bottom: 4px; }
.field { margin-top: 8px; }
.chk { display: flex; gap: 10px; align-items: flex-start; margin-top: 14px; font-size: .88rem; color: var(--muted); }
.chk input { width: 20px; height: 20px; accent-color: var(--green); flex: none; margin-top: 1px; }
.chk a { color: var(--blue); }
.err { color: var(--red); font-weight: 700; margin-top: 10px; }
.done { text-align: center; padding: 30px 10px; }
.done .big { font-size: 3rem; } .done h1 { font-size: 1.5rem; margin: 8px 0; }
.done p { color: var(--muted); }
.st { display: inline-flex; align-items: center; gap: 8px; margin-top: 14px; padding: 8px 16px; border-radius: 999px; font-weight: 800; background: rgba(240,180,41,.12); border: 1px solid var(--gold); color: var(--gold); }
.st.ok { background: rgba(155,240,74,.12); border-color: var(--green); color: var(--green); }
.st.no { background: rgba(255,107,122,.12); border-color: var(--red); color: var(--red); }
.st i { width: 8px; height: 8px; border-radius: 50%; background: currentColor; animation: p 1.4s infinite; } @keyframes p { 50% { opacity: .3; } }
.list { list-style: none; padding: 0; margin: 10px 0 0; display: grid; gap: 6px; }
.list li { display: flex; justify-content: space-between; font-weight: 700; } .list li span:last-child { font-family: ui-monospace, Menlo, monospace; color: var(--green); }
.picker { display: grid; gap: 6px; max-height: 260px; overflow: auto; margin-top: 8px; }
.picker button { text-align: left; background: rgba(255,255,255,.03); border: 1px solid var(--line); color: inherit; font: 700 .95rem var(--font); border-radius: 12px; padding: 10px 12px; cursor: pointer; }
.picker button small { color: var(--muted); font-weight: 600; margin-left: 6px; }
.load { color: var(--muted); text-align: center; padding: 40px 0; }
.draft { position: fixed; top: 10px; right: 10px; background: #f0b429; color: #222; font-weight: 900; font-size: .72rem; padding: 4px 10px; border-radius: 999px; z-index: 9; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <a class="top" href="index.html"><img src="logo.png" alt="">Oceania LOLBeans · Rankings</a>
  <div id="app"><p class="load">Loading the rankings…</p></div>
</div>
<script>
// Quick PB update. Opened from a link on the rankings sheet: pb.html?p=<player name>
// Sends an "update" application to the same approval system as the Get ranked form.
const API = "https://script.google.com/macros/s/AKfycbzZiPoG41opXscV4iuSYMgJPOcuP0NPYDiAUl3Kqpj0Jd3IWBQN2tGyLTPOXStdCYebQQ/exec";
const RANK = "https://docs.google.com/spreadsheets/d/18WTwgf_f_u6oxsUE9JufxDsSWvGcrwa6ev0MfU3UZXg/gviz/tq?tqx=out:csv&gid=0";
const DEC_VIDEO = "https://www.youtube.com/watch?v=oDKziifnviQ";
const MAPS = ["Beacon Bay", "Boulder Hill", "Circus Contest", "Devil's Trick", "Escape Tsunami", "Dash Cup", "Lava Lake", "Gravity Gates", "Hammer Ville", "Jungle Temple", "Kittie Kegs", "Mecha Maze", "Mill Valley", "Monster Manor", "Nasty Seals", "Neon City", "Polar Path", "1-2-3 Red Light", "Rickety Run", "Risky Cliffs", "Shark Park", "Silly Slide", "Spiky Slopes", "Splash Dash", "Tricky Traps", "Tumble Town", "UFO Attack"];
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = n => n == null ? "–" : n.toFixed(3);
const pic = m => "maps/" + encodeURIComponent(MAPS[m].replace(/[\s']/g, "")) + ".png";
const S = { players: [], OR: null, WR: null, me: null, nw: {}, open: -1 };
function csv(t) { const R = []; let r = [], f = "", q = false; for (let i = 0; i < t.length; i++) { const c = t[i]; if (q) { if (c === '"') { if (t[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; } else if (c === '"') q = true; else if (c === ",") { r.push(f); f = ""; } else if (c === "\n") { r.push(f); R.push(r); r = []; f = ""; } else if (c !== "\r") f += c; } if (f || r.length) { r.push(f); R.push(r); } return R; }
const timesOf = r => MAPS.map((_, m) => { const n = parseFloat(r[3 + m]); return isFinite(n) && n > 0 && n < 60 ? n : null; });
function browserId() { try { let b = localStorage.getItem("olb-apply-id"); if (!b) { b = Math.random().toString(36).slice(2) + Date.now().toString(36); localStorage.setItem("olb-apply-id", b); } return b; } catch (e) { return "pb" + Date.now().toString(36); } }
async function api(body) { body.browser = browserId(); const r = await fetch(API, { method: "POST", body: JSON.stringify(body) }); return r.json(); }

async function load() {
  const rows = csv(await (await fetch(RANK)).text()); let on = false;
  for (const x of rows) {
    const name = String(x[2] || "").trim(), place = String(x[1] || "").trim();
    if (/oceania record times/i.test(name)) { S.OR = timesOf(x); continue; }
    if (/world record times/i.test(name)) { S.WR = timesOf(x); continue; }
    if (!name && !place) { if (on) break; continue; }
    if (name && /^\d+$/.test(place)) { on = true; const t = timesOf(x); S.players.push({ name, place: +place, country: String(x[0] || "").toLowerCase().includes("nz") ? "nz" : "aus", t, total: t.reduce((a, v) => a + (v == null ? 60 : v), 0) }); }
  }
  const want = (new URLSearchParams(location.search).get("p") || "").trim().toLowerCase();
  S.me = S.players.find(p => p.name.toLowerCase() === want) || null;
  S.me ? showForm() : showPicker(want);
}

function showPicker(q) {
  $("app").innerHTML = '<div class="card"><h1 style="font-size:1.4rem;font-weight:900">Update my PB</h1><p class="sub">Find your name on the rankings.</p><div class="find"><input id="q" placeholder="Type your name" autocomplete="off" value="' + esc(q) + '"></div><div class="picker" id="pk"></div></div>';
  const draw = () => { const v = $("q").value.trim().toLowerCase(); $("pk").innerHTML = S.players.filter(p => !v || p.name.toLowerCase().includes(v)).slice(0, 30).map(p => '<button type="button" data-n="' + esc(p.name) + '">' + esc(p.name) + "<small>#" + p.place + "</small></button>").join("") || '<p class="sub">No one by that name.</p>'; };
  $("q").addEventListener("input", draw); draw(); $("q").focus();
  $("pk").addEventListener("click", e => { const b = e.target.closest("[data-n]"); if (!b) return; S.me = S.players.find(p => p.name === b.dataset.n); history.replaceState(null, "", "?p=" + encodeURIComponent(S.me.name)); showForm(); });
}

function showForm() {
  const p = S.me;
  $("app").innerHTML =
    '<div class="card"><div class="who"><div class="av">' + esc(p.name.replace(/[^A-Za-z0-9]/g, "").charAt(0).toUpperCase() || "?") + '</div><div><h1>' + esc(p.name) + "</h1><p><b>#" + p.place + "</b> in Oceania · " + p.total.toFixed(3) + 's total · <a href="#" id="notme" style="color:var(--blue)">not you?</a></p></div></div>' +
    "<h2>Tap the map you got a PB on</h2><p class=\"sub\">Times to 3 decimal places, like 34.350.</p>" +
    '<div class="search"><div class="find"><input id="ms" placeholder="🔍 Find a map" autocomplete="off"></div></div><div class="maps" id="maps"></div>' +
    '<div class="box vid" id="vidbox" hidden><b>🎥 Top 20 video needed</b>These times put you at <span id="vidrank"></span>, so we need a quick video of your stats page. Paste the link:<div class="field"><input id="vid" type="url" inputmode="url" placeholder="https://youtu.be/…"></div></div>' +
    '<div class="box rec" id="recbox" hidden><b>🏆 Record time</b><span id="reclist"></span><br>An admin has to check it. A proof video helps (optional):<div class="field"><input id="rec" type="url" inputmode="url" placeholder="https://youtu.be/…"></div></div>' +
    '<label class="chk"><input type="checkbox" id="agree"><span>These are my own times, to 3 decimals (<a href="' + DEC_VIDEO + '" target="_blank" rel="noopener">how to see them</a>). Fake times can get me banned.</span></label>' +
    '<p class="err" id="err" hidden></p></div>' +
    '<div class="bar"><div class="sum"><span id="cnt">No new PBs yet</span><span id="proj"></span></div><button class="btn g" id="send" style="width:100%" disabled>Send for approval</button></div>';
  $("notme").addEventListener("click", e => { e.preventDefault(); S.me = null; S.nw = {}; history.replaceState(null, "", location.pathname); showPicker(""); });
  $("ms").addEventListener("input", drawMaps);
  $("maps").addEventListener("click", e => { const b = e.target.closest(".mp"); if (!b) return; const m = +b.dataset.m; S.open = S.open === m ? -1 : m; drawMaps(); if (S.open >= 0) setTimeout(() => { const i = $("in" + m); if (i) i.focus(); }, 30); });
  $("maps").addEventListener("input", e => { if (e.target.id && e.target.id.startsWith("in")) checkOne(+e.target.id.slice(2), true); });
  $("maps").addEventListener("keydown", e => { if (e.key === "Enter" && e.target.id && e.target.id.startsWith("in")) { e.preventDefault(); S.open = -1; drawMaps(); } });
  ["agree", "vid", "rec"].forEach(id => $(id).addEventListener("input", sync));
  $("agree").addEventListener("change", sync);
  $("send").addEventListener("click", send);
  drawMaps(); sync();
}

function drawMaps() {
  const q = $("ms").value.trim().toLowerCase(), p = S.me;
  $("maps").innerHTML = MAPS.map((n, m) => {
    if (q && !n.toLowerCase().includes(q) && S.open !== m) return "";
    const v = S.nw[m];
    return '<button type="button" class="mp' + (v ? " has" : "") + (S.open === m ? " open" : "") + '" data-m="' + m + '"><img src="' + pic(m) + '" alt="" loading="lazy"><span class="nm">' + esc(n) + (v ? '<br><span class="x">was ' + fmt(p.t[m]) + "</span>" : "") + '</span><span class="cur">' + (v ? v.toFixed(3) : fmt(p.t[m])) + "</span></button>" +
      (S.open === m ? '<div class="ed open"><div class="tm"><input id="in' + m + '" inputmode="decimal" placeholder="' + (p.t[m] != null ? fmt(p.t[m] - 0.1) : "00.000") + '" value="' + (v ? v.toFixed(3) : "") + '"><button class="btn b" type="button" data-done>Done</button></div><p class="hint" id="h' + m + '"></p></div>' : "");
  }).join("");
  if (S.open >= 0) checkOne(S.open, false);
}

function checkOne(m, live) {
  const i = $("in" + m), h = $("h" + m); if (!i) return; const v = i.value.trim().replace(",", "."), cur = S.me.t[m];
  h.className = "hint";
  if (!v) { delete S.nw[m]; h.textContent = cur != null ? "Your time now: " + fmt(cur) : "No time on this map yet"; sync(); return; }
  if (!/^\d{1,2}\.\d{3}$/.test(v)) { delete S.nw[m]; h.className = "hint bad"; h.textContent = /^\d{1,2}(\.\d{1,2})?$/.test(v) ? "Use 3 decimals, like " + (+v).toFixed(3) : "That doesn't look like a time"; sync(); return; }
  const n = +v;
  if (n < 1 || n >= 60) { delete S.nw[m]; h.className = "hint bad"; h.textContent = "Times must be under 60s"; sync(); return; }
  if (cur != null && n >= cur - 0.0005) { delete S.nw[m]; h.className = "hint bad"; h.textContent = "Not faster than your " + fmt(cur); sync(); return; }
  S.nw[m] = n;
  if (S.WR && S.WR[m] != null && n < S.WR[m] - 0.0005) { h.className = "hint rec"; h.textContent = "🌍 Faster than the world record! An admin will check it."; }
  else if (S.OR && S.OR[m] != null && n < S.OR[m] - 0.0005) { h.className = "hint rec"; h.textContent = "🏆 New Oceania record! An admin will check it."; }
  else { h.className = "hint ok"; h.textContent = "PB! " + (cur != null ? "−" + (cur - n).toFixed(3) + "s" : "first time on this map"); }
  sync();
  if (live) { const b = document.querySelector('.mp[data-m="' + m + '"]'); if (b) { b.classList.add("has"); b.querySelector(".cur").textContent = n.toFixed(3); } }
}
document.addEventListener("click", e => { if (e.target.closest("[data-done]")) { S.open = -1; drawMaps(); } });

function proj() {
  const t = S.me.t.map((v, m) => S.nw[m] != null ? S.nw[m] : v), total = t.reduce((a, v) => a + (v == null ? 60 : v), 0);
  return { total, rank: S.players.filter(p => p !== S.me && p.total < total - 1e-9).length + 1 };
}
function records() { return Object.keys(S.nw).map(Number).filter(m => (S.WR && S.WR[m] != null && S.nw[m] < S.WR[m] - 0.0005) || (S.OR && S.OR[m] != null && S.nw[m] < S.OR[m] - 0.0005)); }
function needVid() { return Object.keys(S.nw).length && proj().rank <= 20; }
function sync() {
  const k = Object.keys(S.nw).length, P = proj();
  $("cnt").innerHTML = k ? "<b>" + k + " new PB" + (k > 1 ? "s" : "") + "</b>" : "No new PBs yet";
  $("proj").innerHTML = k ? "You'd be <b>#" + P.rank + "</b>" + (P.rank < S.me.place ? " (up " + (S.me.place - P.rank) + ")" : "") : "";
  $("vidbox").hidden = !needVid(); if (needVid()) $("vidrank").textContent = "#" + P.rank;
  const rc = records(); $("recbox").hidden = !rc.length; $("reclist").textContent = rc.map(m => MAPS[m] + " " + S.nw[m].toFixed(3)).join(", ");
  $("send").disabled = !k || !$("agree").checked || (needVid() && !/^https:\/\/\S{6,}/.test($("vid").value.trim()));
}

async function send() {
  const btn = $("send"), err = $("err"); err.hidden = true; btn.disabled = true; btn.textContent = "Sending…";
  try {
    const times = MAPS.map((_, m) => S.nw[m] != null ? S.nw[m] : null);
    const r = await api({ action: "apply", name: S.me.name, current: S.me.name, country: S.me.country, times, agree: true, video: true, proof: "", videoLink: needVid() ? $("vid").value.trim() : "", recordLink: records().length ? $("rec").value.trim() : "", discord: "" });
    if (!r || !r.ok) throw new Error((r && r.error) || "Something went wrong. Try again.");
    done();
  } catch (x) { err.textContent = x.message; err.hidden = false; btn.disabled = false; btn.textContent = "Send for approval"; }
}
function done() {
  const list = Object.keys(S.nw).map(Number).map(m => "<li><span>" + esc(MAPS[m]) + "</span><span>" + S.nw[m].toFixed(3) + "</span></li>").join("");
  $("app").innerHTML = '<div class="card done"><div class="big">⏳</div><h1>Sent! Waiting for approval</h1><p>An admin will check it soon. Once it\'s approved, the sheet and the website update by themselves.</p><ul class="list">' + list + '</ul><div class="st" id="st"><i></i>Waiting for approval</div><p class="sub" style="margin-top:14px">You can close this page. Come back to it to check.</p></div>';
  poll();
}
async function poll() {
  try { const r = await api({ action: "status" }); const a = r && r.app; const st = $("st"); if (!st || !a) return;
    if (a.status === "approved") { st.className = "st ok"; st.textContent = "✅ Approved! You're on the rankings"; return; }
    if (a.status === "declined") { st.className = "st no"; st.textContent = "❌ Declined" + (a.note ? ": " + a.note : ""); return; }
  } catch (e) {}
  setTimeout(poll, 20000);
}
load().catch(() => { $("app").innerHTML = '<p class="load">Couldn\'t load the rankings. Refresh to try again.</p>'; });
</script>
<div class="draft">DRAFT</div>
</body>
</html>
