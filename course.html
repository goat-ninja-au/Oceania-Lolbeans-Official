<style>
/* Layout: clean light-blue site matching the recoloured Academy pages. Sticky header, left-aligned hero, simple stacked sections in a 1040px column. */
:root {
  --bg: #c3e1f4;
  --panel: #ffffff;
  --panel-2: #acd3ec;
  --line: #98c5e2;
  --text: #0c2a43;
  --muted: #3a5a73;
  --blue: #1478c2;
  --blue-hover: #0f62a0;
  --green: #3fb80a;
  --font: "Figtree", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--text); font-family: var(--font); font-size: 16px; line-height: 1.6; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap { max-width: 1040px; margin: 0 auto; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { margin: 0; line-height: 1.15; text-wrap: balance; font-weight: 800; }
p { margin: 0; max-width: 62ch; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; border-radius: 6px; }

/* Header */
header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: rgba(195,225,244,.92); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
header .wrap { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 20px; padding-block: 12px; }
.brand { display: inline-flex; align-items: center; gap: 12px; text-decoration: none; font-weight: 800; font-size: 1.05rem; }
.brand img { width: 40px; height: 40px; border-radius: 8px; object-fit: cover; }
.brand .mark { width: 40px; height: 40px; border-radius: 8px; background: var(--blue); color: #fff; display: grid; place-items: center; font-weight: 800; font-size: .9rem; }
nav { display: flex; flex-wrap: wrap; gap: 2px; }
nav a { text-decoration: none; color: var(--muted); font-weight: 600; font-size: .95rem; padding: 8px 12px; border-radius: 8px; }
nav a:hover { color: var(--text); background: var(--panel-2); }

/* Hero */
.hero { padding-block: 88px 72px; border-bottom: 1px solid var(--line); background: radial-gradient(80% 120% at 100% 0%, rgba(20,120,194,.18), transparent 60%); }
.hero .wrap { display: grid; gap: 22px; }
.eyebrow { color: var(--blue); font-weight: 700; font-size: .85rem; letter-spacing: .08em; text-transform: uppercase; }
.hero h1 { font-size: clamp(2.2rem, 6vw, 3.6rem); max-width: 16ch; }
.hero p { font-size: 1.15rem; color: var(--muted); }
.actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 6px; }
.btn { display: inline-flex; align-items: center; font: 700 1rem var(--font); padding: 12px 20px; border-radius: 8px; text-decoration: none; border: 1px solid transparent; cursor: pointer; }
.btn-primary { background: var(--blue); color: #fff; }
.btn-primary:hover { background: var(--blue-hover); }
.btn-outline { border-color: var(--line); color: var(--text); background: transparent; }
.btn-outline:hover { background: var(--panel-2); }

/* Sections */
section.block { padding-block: 72px; border-bottom: 1px solid var(--line); }
.sec-head { display: grid; gap: 10px; margin-bottom: 32px; }
.sec-head h2 { font-size: clamp(1.6rem, 4vw, 2.2rem); }
.sec-head p { color: var(--muted); }

.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 2px 8px rgba(12,42,67,.06); padding: 22px; display: grid; gap: 8px; align-content: start; }
.card h3 { font-size: 1.1rem; }
.card p { color: var(--muted); }

.feature { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: clamp(22px, 4vw, 36px); display: grid; grid-template-columns: 1fr auto; gap: 24px; align-items: center; }
.feature .text { display: grid; gap: 10px; min-width: 0; }
.feature h2 { font-size: clamp(1.5rem, 3.6vw, 2rem); }
.feature p { color: var(--muted); }
.feature.academy { border-left: 4px solid var(--green); }
.feature.academy .eyebrow { color: var(--green); }
.btn-green { background: var(--green); color: #0b1a02; }
.btn-green:hover { filter: brightness(.92); }
.note { font-size: .92rem; }
.soon { font-weight: 800; padding: 10px 16px; border-radius: 8px; background: var(--panel-2); color: var(--muted); white-space: nowrap; }
@media (max-width: 640px) { .feature { grid-template-columns: 1fr; } .feature .btn { justify-self: start; } }

/* Join */
.join-row { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; max-width: 520px; }
.join-row .label { color: var(--muted); font-weight: 600; font-size: .9rem; }
.join-row .name { font-weight: 800; font-size: 1.15rem; flex: 1; min-width: 0; overflow-wrap: anywhere; user-select: all; }
.copy { font: 700 .9rem var(--font); padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel-2); color: var(--text); cursor: pointer; }
.copy:hover { border-color: var(--blue); }

footer .wrap { padding-block: 28px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px; color: var(--muted); font-size: .9rem; }
.soon-wrap { padding-block: 120px; text-align: center; }
.soon-wrap .wrap { display: grid; gap: 16px; justify-items: center; }
.soon-wrap h1 { font-size: clamp(2.2rem, 7vw, 3.6rem); }
.soon-wrap p { color: var(--muted); font-size: 1.1rem; }
nav a[aria-current] { color: var(--text); background: var(--panel); }

/* Dark mode (toggle in the header, shared across the site) */
:root[data-mode="dark"] { --bg: #0d1a26; --panel: #142636; --panel-2: #1c3346; --line: #27445c; --text: #e6f1f9; --muted: #9cb6c9; --blue: #4aa8f0; --blue-hover: #6bb9f5; color-scheme: dark; }
header { background: color-mix(in srgb, var(--bg) 92%, transparent) !important; }
.mode { width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); color: var(--text); font-size: 1.05rem; cursor: pointer; }
.head-right { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
nav a[aria-current] { color: var(--text); background: var(--panel); }

/* ☰ menu on phones (shared across pages) */
.menu-btn { display: none; color: var(--text); cursor: pointer; }
/* top bar hides when you scroll down, comes back when you scroll up */
.olb-top { transition: transform .25s ease; will-change: transform; }
html.olb-hidden .olb-top { transform: translateY(calc(-100% - env(safe-area-inset-top, 0px) - 2px)); }
html.olb-hidden .sim-sum { top: calc(env(safe-area-inset-top, 0px) + 12px); }
.sim-sum { transition: top .25s ease; }
@media (prefers-reduced-motion: reduce) { .olb-top, .sim-sum { transition: none; } }
@media (max-width: 760px) {
  .menu-btn { display: inline-grid; place-items: center; font-size: 1.2rem; }
  .olb-top .wrap { flex-wrap: nowrap !important; gap: 8px !important; }
  .olb-top .brand { flex: 1 1 0; min-width: 0; font-size: .95rem; line-height: 1.2; gap: 10px; margin-right: 0; }
  .olb-top .head-right { flex-wrap: nowrap; }
  .olb-top nav[aria-label="Main"] { display: none !important; position: absolute; left: 0; right: 0; top: 100%; z-index: 40; flex-direction: column; flex-wrap: nowrap; gap: 0; padding: 4px max(16px, env(safe-area-inset-left, 0px)) 12px; background: var(--bg); border-bottom: 1px solid var(--line); box-shadow: 0 12px 24px rgba(7,17,28,.18); max-height: calc(100vh - 70px); overflow-y: auto; }
  .olb-top.open nav[aria-label="Main"] { display: flex !important; }
  .olb-top nav[aria-label="Main"] a { padding: 12px; border-radius: 0; border-bottom: 1px solid var(--line); font-size: 1rem; }
  .olb-top nav[aria-label="Main"] a:last-child { border-bottom: 0; }
}

/* ---------- Academy: password homepage ---------- */
.ac { background: #070f1a; color: #e6f1f9; }
.ac a { color: inherit; }
.ac-stage { position: relative; overflow: hidden; padding: 60px 0 70px; }
.ac-bg { position: absolute; inset: -60px -60px auto; display: grid; grid-template-columns: repeat(6, 1fr); gap: 14px; padding: 30px; filter: blur(6px) saturate(1.2); opacity: .32; transform: rotate(-6deg) scale(1.15); pointer-events: none; }
.ac-bg .mt { border-radius: 14px; overflow: hidden; background: #123; aspect-ratio: 16/10; } .ac-bg img { width: 100%; height: 100%; object-fit: cover; }
.ac-stage:before { content: ""; position: absolute; inset: 0; background: radial-gradient(60% 60% at 50% 40%, rgba(7,15,26,.55), #070f1a 75%), linear-gradient(180deg, rgba(7,15,26,.2), #070f1a); z-index: 1; }
.ac-stage:after { content: ""; position: absolute; inset: 0; background-image: linear-gradient(rgba(90,170,255,.05) 1px, transparent 1px), linear-gradient(90deg, rgba(90,170,255,.05) 1px, transparent 1px); background-size: 34px 34px; z-index: 1; -webkit-mask: radial-gradient(closest-side, #000, transparent); mask: radial-gradient(closest-side, #000, transparent); pointer-events: none; }
.ac-inner { position: relative; z-index: 2; display: grid; grid-template-columns: 1.1fr .9fr; gap: 48px; align-items: center; }
.ac-eyebrow { color: #9bf04a; font-weight: 800; font-size: .8rem; letter-spacing: .16em; text-transform: uppercase; text-shadow: 0 0 10px rgba(155,240,74,.5); }
.ac h1 { font-size: clamp(2.4rem, 5.4vw, 4rem); line-height: 1.02; font-weight: 900; letter-spacing: -.02em; margin: 12px 0 16px; color: #fff; }
.ac h1 span { background: linear-gradient(90deg, #4aa8f0, #9bf04a); -webkit-background-clip: text; background-clip: text; color: transparent; }
.ac-lead { color: #9cb6c9; font-size: 1.15rem; max-width: 520px; }
.ac-stats { display: flex; gap: 26px; flex-wrap: wrap; margin: 26px 0; } .ac-stats b { display: block; font-size: 1.8rem; font-weight: 900; line-height: 1.1; } .ac-stats span { color: #9cb6c9; font-size: .82rem; }
.ac-feat { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; max-width: 600px; }
.ac-feat div { background: rgba(255,255,255,.04); border: 1px solid #1f3a57; border-radius: 16px; padding: 14px; } .ac-feat .e { font-size: 1.5rem; } .ac-feat b { display: block; font-size: .95rem; margin: 4px 0 2px; } .ac-feat small { color: #9cb6c9; font-size: .8rem; line-height: 1.35; display: block; }
.ac-lock { position: relative; background: linear-gradient(160deg, rgba(29,63,143,.35), rgba(13,26,38,.92) 60%); border: 1px solid #2a4b6a; border-radius: 26px; padding: 34px 30px 26px; box-shadow: 0 30px 60px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.06); }
.ac-lock:before { content: ""; position: absolute; inset: -1px; border-radius: inherit; padding: 1px; background: linear-gradient(140deg, rgba(74,168,240,.7), transparent 40%, transparent 60%, rgba(155,240,74,.6)); -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; pointer-events: none; }
.ac-pad { width: 78px; height: 78px; border-radius: 22px; margin: 0 auto 14px; display: grid; place-items: center; font-size: 36px; background: radial-gradient(circle at 40% 30%, #1d4f8f, #0b1d36); border: 1px solid #3a6a96; box-shadow: 0 0 30px rgba(74,168,240,.35); transition: transform .3s; }
.ac-pad.open { transform: scale(1.08) rotate(-8deg); box-shadow: 0 0 40px rgba(155,240,74,.6); border-color: #9bf04a; }
.ac-lock h2 { text-align: center; font-size: 1.6rem; font-weight: 900; color: #fff; } .ac-lock p.s { text-align: center; color: #9cb6c9; margin: 6px 0 20px; }
.ac-inp { display: flex; align-items: center; gap: 10px; background: #0a1626; border: 1px solid #3a6a96; border-radius: 14px; padding: 0 8px 0 14px; height: 56px; box-shadow: 0 0 0 4px rgba(74,168,240,.12); cursor: text; }
.ac-inp:focus-within { border-color: #9bf04a; box-shadow: 0 0 0 4px rgba(155,240,74,.15); }
.ac-inp .ic { color: #9bf04a; } .ac-inp input { flex: 1; min-width: 0; background: none; border: 0; color: #fff; font: 600 1.05rem var(--font); outline: none; }

.ac-go:hover { filter: brightness(1.06); }
.ac-rem { margin-top: 14px; color: #9cb6c9; font-size: .9rem; } .ac-rem label { display: flex; gap: 8px; align-items: center; cursor: pointer; } .ac-rem input { accent-color: #9bf04a; width: 16px; height: 16px; }
.ac-how { margin-top: 18px; padding-top: 16px; border-top: 1px solid #1f3a57; display: flex; gap: 12px; align-items: center; font-size: .9rem; color: #9cb6c9; }
.ac-how .d { width: 40px; height: 40px; border-radius: 12px; background: #5865f2; display: grid; place-items: center; color: #fff; font-weight: 900; flex: none; } .ac-how b { color: #fff; } .ac-how a { color: #4aa8f0; font-weight: 800; }
.ac-peek { position: relative; z-index: 2; margin-top: 44px; }
.ac-peek h3, .ag-top .ac-eyebrow { font-size: .8rem; }
.ac-peek h3 { letter-spacing: .14em; color: #9cb6c9; text-transform: uppercase; font-weight: 800; margin-bottom: 12px; display: flex; gap: 10px; align-items: center; } .ac-peek h3:after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, #27445c, transparent); }

/* ---------- Academy: choose a map ---------- */
.ac-in { position: relative; padding: 40px 0 80px; overflow: hidden; }
.ac-in:before { content: ""; position: absolute; inset: 0; background: radial-gradient(50% 40% at 15% 0%, rgba(74,168,240,.16), transparent 70%), radial-gradient(45% 35% at 90% 10%, rgba(155,240,74,.10), transparent 70%); pointer-events: none; }
.ag-wrap { position: relative; max-width: 1500px; margin: 0 auto; padding: 0 max(20px, env(safe-area-inset-left, 0px)); }
.ag-top { display: flex; justify-content: space-between; align-items: end; gap: 16px; margin-bottom: 26px; }

@keyframes ag-in { from { opacity: 0; transform: translateY(14px) scale(.97); } }
/* PB popup */

<script>
// ☰ menu on phones
(function () {
  var mode = document.getElementById("mode"), btn = document.getElementById("menu");
  if (!mode || !btn) return;
  var top = mode.closest("header"); top.classList.add("olb-top");
  function set(o) { top.classList.toggle("open", o); btn.setAttribute("aria-expanded", String(o)); btn.setAttribute("aria-label", o ? "Close menu" : "Open menu"); btn.textContent = o ? "✕" : "☰"; }
  btn.addEventListener("click", function (e) { e.stopPropagation(); set(!top.classList.contains("open")); });
  document.addEventListener("click", function (e) { if (top.classList.contains("open") && (!top.contains(e.target) || e.target.closest("nav a"))) set(false); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") set(false); });
  // hide the top bar while scrolling down, show it again when scrolling up
  var lastY = window.scrollY, root = document.documentElement, ticking = false;
  function onScroll() {
    var y = window.scrollY, dy = y - lastY;
    if (top.classList.contains("open") || y < top.offsetHeight + 20) root.classList.remove("olb-hidden");
    else if (dy > 6) root.classList.add("olb-hidden");
    else if (dy < -6) root.classList.remove("olb-hidden");
    if (Math.abs(dy) > 6 || y < 20) lastY = y;
    ticking = false;
  }
  window.addEventListener("scroll", function () { if (!ticking) { ticking = true; requestAnimationFrame(onScroll); } }, { passive: true });
  top.addEventListener("focusin", function () { root.classList.remove("olb-hidden"); });
})();
