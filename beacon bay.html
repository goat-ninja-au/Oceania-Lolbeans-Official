<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beacon Bay Tutorial</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<a href="tutorials.html" class="back-btn">← Back</a>

<section class="password-box">
    <h2>Beacon Bay – Enter Your PB</h2>

    <input type="number" id="pbInput" placeholder="Enter your PB (seconds)">
    <button onclick="checkPB()">Get Tutorial</button>

    <p id="error" style="color:red; display:none;">Please enter a valid PB</p>
</section>

<script>
function checkPB() {
    const pb = parseFloat(document.getElementById("pbInput").value);
    const error = document.getElementById("error");

    // ❌ Invalid PB
    if (isNaN(pb) || pb <= 0) {
        error.style.display = "block";
        return;
    }

    // ✔ Valid PB
    error.style.display = "none";

    // ⭐ Beacon Bay routing logic
    if (pb >= 34.500) {
        window.location.href = "beacon bay level 1.html";
    }
    else if (pb >= 34.350) {
        window.location.href = "beacon bay level 2.html";
    }
    else if (pb >= 34.333) {
        window.location.href = "beacon bay level 3.html";
    }
    else {
        window.location.href = "beacon bay level 4.html";
    }
}
</script>
</body>
</html>
